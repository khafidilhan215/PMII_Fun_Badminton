<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMII Fun Badminton</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

        .bg-logo-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vh;
            height: 60vh;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
            object-fit: contain;
            user-select: none;
        }

        .bracket-container {
            display: flex;
            flex-direction: row;
            padding: 20px;
        }

        .bracket-column {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            margin-right: 50px;
            position: relative;
        }

        .match-pair {
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            margin: 10px 0;
        }

        .match-pair::after {
            content: '';
            position: absolute;
            right: -25px;
            top: 25%;
            bottom: 25%;
            width: 2px;
            background-color: #555;
            border-top: 2px solid #555;
            border-bottom: 2px solid #555;
            border-right: 2px solid #555;
        }

        .match-pair .match-box::after {
            content: '';
            position: absolute;
            right: -25px;
            top: 50%;
            width: 25px;
            height: 2px;
            background-color: #555;
        }

        .bracket-column:not(:last-child)::after {
            content: '';
            position: absolute;
            right: -25px;
            top: 50%;
            width: 25px;
            height: 2px;
            background-color: #555;
        }

        .bracket-column.single-match .match-pair::after { display: none; }
        .bracket-column.single-match .match-box::after { display: none; }

        .match-box {
            background: #374151;
            border: 1px solid #4b5563;
            border-radius: 4px;
            width: 220px;
            margin: 6px 0;
            position: relative;
            z-index: 10;
            transition: all 0.2s;
        }

        .match-box:hover { border-color: #60a5fa; }

        .team-slot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            font-size: 14px;
        }

        .team-slot:first-child { border-bottom: 1px solid #4b5563; }

        .winner-slot {
            background-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
            font-weight: bold;
        }

        /* Status Indicator */
        #connection-status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            z-index: 100;
            transition: all 0.3s;
        }
        .status-connected { background: #065f46; color: #6ee7b7; }
        .status-disconnected { background: #7f1d1d; color: #fca5a5; }
        .status-saving { background: #78350f; color: #fcd34d; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans h-screen flex flex-col overflow-hidden">

    <!-- Status Koneksi -->
    <div id="connection-status" class="status-disconnected">● Menghubungkan...</div>

    <!-- NAVBAR -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center z-50 relative">
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showLandingPage()">
                <img src="logo.png" alt="Logo" class="h-8 w-8 object-contain" onerror="this.style.display='none'">
                <h1 class="text-xl font-bold">PMII Fun Badminton</h1>
            </div>
            <span id="nav-bracket-name" class="text-gray-400 hidden border-l border-gray-600 pl-4"></span>
        </div>
        <div class="flex items-center space-x-4">
            <button id="btn-login" onclick="openLoginModal()" class="bg-blue-600 hover:bg-blue-700 px-4 py-1 rounded text-sm font-bold">Login Admin</button>
            <span id="admin-status" class="text-sm text-green-400 font-bold hidden">Admin Mode</span>
            <button id="btn-logout" onclick="logoutAdmin()" class="bg-red-600 hover:bg-red-700 px-4 py-1 rounded text-sm hidden">Logout</button>
            <button id="btn-back" onclick="showLandingPage()" class="bg-gray-600 hover:bg-gray-700 px-4 py-1 rounded text-sm hidden">Kembali ke Home</button>
        </div>
    </nav>

    <!-- LANDING PAGE -->
    <div id="landing-page" class="flex-1 p-8 overflow-y-auto relative">
        <img src="logo.png" alt="" class="bg-logo-overlay" onerror="this.style.display='none'">
        <div class="max-w-5xl mx-auto relative z-10">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Turnamen Aktif</h2>
                <div class="flex space-x-3">
                    <button id="btn-delete-all" onclick="deleteAllBrackets()" class="bg-red-700 hover:bg-red-800 px-4 py-2 rounded font-bold hidden text-sm">
                        🗑️ Hapus Semua Bracket
                    </button>
                    <button id="btn-add-bracket" onclick="createNewBracket()" class="bg-green-600 hover:bg-green-700 px-6 py-2 rounded font-bold hidden">
                        + Buat Bracket Baru
                    </button>
                </div>
            </div>
            <div id="bracket-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <!-- BRACKET VIEW PAGE -->
    <div id="bracket-page" class="flex-1 flex hidden h-full">
        <div class="w-80 bg-gray-800 border-r border-gray-700 flex flex-col overflow-y-auto z-40">
            <div class="p-4 border-b border-gray-700">
                <h3 class="text-sm font-bold text-gray-400 mb-3">BRACKET INFORMATION</h3>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-400">Bracket Name</label>
                        <input type="text" id="input-bracket-name" onchange="updateBracketName(this.value)" class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500 disabled:opacity-50">
                    </div>
                </div>
            </div>

            <div class="p-4 flex-1">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-gray-400">PARTICIPANTS</h3>
                    <span id="participant-count" class="text-xs bg-gray-700 px-2 py-1 rounded">0</span>
                </div>
                <div id="participant-list" class="space-y-2 mb-4"></div>

                <div id="admin-participant-controls" class="hidden mt-4 p-3 bg-gray-900 rounded border border-gray-700">
                    <label class="block text-xs text-gray-400 mb-1">Jumlah Peserta (Auto Generate)</label>
                    <div class="flex space-x-2">
                        <input type="number" id="input-participant-count" min="2" max="64" value="4" class="w-20 bg-gray-700 border border-gray-600 rounded px-2 py-1 text-sm focus:outline-none text-center">
                        <button onclick="generateParticipants()" class="flex-1 bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-sm font-bold">Generate</button>
                    </div>
                    <p class="text-[10px] text-gray-500 mt-2">*Klik nama tim di daftar atas untuk mengeditnya.</p>
                </div>
            </div>

            <div class="p-4 border-t border-gray-700 bg-gray-800">
                <div id="bracket-status" class="text-center text-sm font-bold text-yellow-400 mb-2">Pending</div>
                <button id="btn-start-tournament" onclick="startTournament()" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold text-sm hidden">START TOURNAMENT</button>
            </div>
        </div>

        <div class="flex-1 bg-gray-900 overflow-auto p-8 relative" id="bracket-canvas">
            <img src="logo.png" alt="" class="bg-logo-overlay" onerror="this.style.display='none'">
            <div id="bracket-container" class="bracket-container min-w-max pt-8 relative z-10"></div>
        </div>
    </div>

    <!-- MODAL LOGIN ADMIN -->
    <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-50">
        <div class="bg-gray-800 rounded-lg shadow-xl w-80 overflow-hidden border border-gray-600">
            <div class="bg-gray-700 px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-lg">Login Admin</h3>
                <button onclick="closeLoginModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-6">
                <input type="password" id="admin-password-input" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 mb-4 focus:outline-none focus:border-blue-500" placeholder="Password...">
                <button onclick="verifyAdminLogin()" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold">Masuk</button>
            </div>
        </div>
    </div>

    <!-- MODAL REPORT SCORES -->
    <div id="score-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center hidden z-50">
        <div class="bg-gray-800 rounded-lg shadow-xl w-96 overflow-hidden border border-gray-600">
            <div class="bg-gray-700 px-4 py-2 flex justify-between items-center">
                <h3 class="font-bold">Report Scores</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            <div class="p-4">
                <div class="space-y-4">
                    <div class="flex justify-between items-center bg-gray-700 p-2 rounded">
                        <span id="modal-team1-name" class="font-bold truncate w-32">Team 1</span>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="modal-team1-score" class="w-12 bg-gray-600 border border-gray-500 rounded text-center text-sm" value="0" min="0">
                            <button onclick="changeScore('modal-team1-score', 1)" class="bg-gray-600 px-2 rounded hover:bg-gray-500">+</button>
                        </div>
                    </div>
                    <div class="flex justify-between items-center bg-gray-700 p-2 rounded">
                        <span id="modal-team2-name" class="font-bold truncate w-32">Team 2</span>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="modal-team2-score" class="w-12 bg-gray-600 border border-gray-500 rounded text-center text-sm" value="0" min="0">
                            <button onclick="changeScore('modal-team2-score', 1)" class="bg-gray-600 px-2 rounded hover:bg-gray-500">+</button>
                        </div>
                    </div>
                </div>
                <div class="mt-6 flex justify-between">
                    <button onclick="submitScore()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded font-bold w-full">SUBMIT SCORES</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === KONFIGURASI FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyAhijrUPWJv3efN4BZecIDkvhaA5C4J4H8",
            authDomain: "pmii-funbadminton.firebaseapp.com",
            databaseURL: "https://pmii-funbadminton-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pmii-funbadminton",
            storageBucket: "pmii-funbadminton.firebasestorage.app",
            messagingSenderId: "1032397843409",
            appId: "1:1032397843409:web:966ecb7a79d19951298ef0"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const bracketsRef = db.ref('brackets');

        const ADMIN_PASSWORD = "admin123";
        let brackets = [];
        let currentBracketId = null;
        let isAdmin = false;
        let currentMatch = null;
        let isInitialLoad = true;

        // === STATUS KONEKSI ===
        function updateConnectionStatus(status) {
            const el = document.getElementById('connection-status');
            el.className = '';
            if (status === 'connected') {
                el.classList.add('status-connected');
                el.textContent = '● Terhubung ke Server';
            } else if (status === 'saving') {
                el.classList.add('status-saving');
                el.textContent = '● Menyimpan...';
            } else {
                el.classList.add('status-disconnected');
                el.textContent = '● Terputus dari Server';
            }
        }

        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                updateConnectionStatus('connected');
            } else {
                updateConnectionStatus('disconnected');
            }
        });

        // === REALTIME LISTENER DARI FIREBASE ===
        bracketsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                brackets = Object.values(data);
            } else {
                brackets = [];
            }

            // Render ulang tampilan
            if (currentBracketId) {
                const stillExists = brackets.find(b => b.id === currentBracketId);
                if (stillExists) {
                    renderBracketPage();
                } else {
                    showLandingPage();
                }
            } else {
                renderLandingPage();
            }

            if (isInitialLoad) {
                isInitialLoad = false;
                console.log("Data awal dimuat dari Firebase:", brackets);
            }
        }, (error) => {
            console.error("Firebase error:", error);
            alert("Gagal terhubung ke Firebase. Cek Rules database Anda!");
            updateConnectionStatus('disconnected');
        });

        // === SIMPAN DATA KE FIREBASE ===
        async function saveData() {
            updateConnectionStatus('saving');
            try {
                const dataToSave = {};
                brackets.forEach(b => { dataToSave[b.id] = b; });
                await bracketsRef.set(dataToSave);
                updateConnectionStatus('connected');
            } catch (err) {
                console.error("Gagal simpan:", err);
                alert("Gagal menyimpan data ke server!");
                updateConnectionStatus('disconnected');
            }
        }

        // === ADMIN LOGIC ===
        function openLoginModal() {
            document.getElementById('admin-password-input').value = '';
            document.getElementById('login-modal').classList.remove('hidden');
        }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }
        function verifyAdminLogin() {
            if (document.getElementById('admin-password-input').value === ADMIN_PASSWORD) {
                isAdmin = true; closeLoginModal(); updateAdminUI();
                if (currentBracketId) renderBracketPage();
            } else { alert("Password salah!"); }
        }
        function logoutAdmin() {
            isAdmin = false; updateAdminUI();
            if (currentBracketId) renderBracketPage();
        }
        function updateAdminUI() {
            document.getElementById('btn-login').classList.toggle('hidden', isAdmin);
            document.getElementById('btn-logout').classList.toggle('hidden', !isAdmin);
            document.getElementById('admin-status').classList.toggle('hidden', !isAdmin);
            document.getElementById('btn-add-bracket').classList.toggle('hidden', !isAdmin);
            document.getElementById('btn-delete-all').classList.toggle('hidden', !isAdmin);
        }

        // === LANDING PAGE ===
        function renderLandingPage() {
            document.getElementById('landing-page').classList.remove('hidden');
            document.getElementById('bracket-page').classList.add('hidden');
            document.getElementById('nav-bracket-name').classList.add('hidden');
            document.getElementById('btn-back').classList.add('hidden');

            const list = document.getElementById('bracket-list');
            list.innerHTML = brackets.length === 0 ? '<p class="text-gray-500 col-span-full">Belum ada turnamen.</p>' : '';

            brackets.forEach(b => {
                const card = document.createElement('div');
                card.className = "relative bg-gray-800 p-5 rounded-lg border border-gray-700 hover:border-blue-500 cursor-pointer transition shadow-lg group";
                card.onclick = (e) => {
                    if (e.target.closest('.btn-delete-single')) return;
                    openBracket(b.id);
                };
                card.innerHTML = `
                    ${isAdmin ? `<button onclick="deleteSingleBracket('${b.id}', event)" class="btn-delete-single absolute top-2 right-2 bg-red-600 hover:bg-red-700 text-white w-7 h-7 rounded-full font-bold text-sm flex items-center justify-center opacity-70 hover:opacity-100 transition" title="Hapus Bracket Ini">&times;</button>` : ''}
                    <h3 class="font-bold text-xl mb-2 text-white pr-6">${b.name}</h3>
                    <p class="text-sm text-gray-400 mb-3">Peserta: ${b.participants ? b.participants.length : 0} Tim</p>
                    <div class="flex justify-between items-center">
                        <span class="text-xs px-2 py-1 rounded font-bold ${b.status === 'In Progress' ? 'bg-green-900 text-green-300' : 'bg-yellow-900 text-yellow-300'}">${b.status}</span>
                        <span class="text-blue-400 text-sm font-bold">Lihat &rarr;</span>
                    </div>`;
                list.appendChild(card);
            });
        }

        function deleteAllBrackets() {
            if (!isAdmin) return;
            if (brackets.length === 0) return alert("Belum ada bracket untuk dihapus.");
            if (!confirm("⚠️ PERINGATAN! Anda akan menghapus SEMUA bracket turnamen.\n\nTindakan ini tidak bisa dibatalkan. Lanjutkan?")) return;
            if (!confirm("Konfirmasi terakhir: Yakin hapus SEMUA bracket?")) return;
            brackets = [];
            saveData();
            alert("Semua bracket telah dihapus.");
        }

        function deleteSingleBracket(id, event) {
            if (!isAdmin) return;
            if (event) event.stopPropagation();
            const bracket = brackets.find(b => b.id === id);
            if (!bracket) return;
            if (confirm(`Hapus bracket "${bracket.name}"? Tindakan ini tidak bisa dibatalkan.`)) {
                brackets = brackets.filter(b => b.id !== id);
                saveData();
            }
        }

        function createNewBracket() {
            if (!isAdmin) return;
            const newBracket = { id: Date.now().toString(), name: "Turnamen Baru " + (brackets.length + 1), type: "Single Elimination", status: "Pending", participants: [], matches: [] };
            brackets.push(newBracket);
            saveData();
            openBracket(newBracket.id);
        }

        // === BRACKET PAGE ===
        function openBracket(id) {
            currentBracketId = id;
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('bracket-page').classList.remove('hidden');
            document.getElementById('btn-back').classList.remove('hidden');
            renderBracketPage();
        }

        function renderBracketPage() {
            const bracket = brackets.find(b => b.id === currentBracketId);
            if (!bracket) { showLandingPage(); return; }

            document.getElementById('nav-bracket-name').textContent = bracket.name;
            document.getElementById('nav-bracket-name').classList.remove('hidden');

            const inputName = document.getElementById('input-bracket-name');
            inputName.value = bracket.name;
            inputName.disabled = !isAdmin || bracket.status !== 'Pending';

            const pList = document.getElementById('participant-list');
            pList.innerHTML = '';
            if (bracket.participants) {
                bracket.participants.forEach((p, index) => {
                    const pDiv = document.createElement('div');
                    pDiv.className = "flex items-center space-x-2 bg-gray-700 p-1 rounded text-sm border border-gray-600";
                    if (isAdmin && bracket.status === 'Pending') {
                        pDiv.innerHTML = `<span class="text-gray-400 w-4 text-center text-xs">${index + 1}</span>
                            <input type="text" value="${p.name}" onchange="editParticipantName('${p.id}', this.value)" class="flex-1 bg-gray-600 border border-gray-500 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-400">
                            <button onclick="removeParticipant('${p.id}')" class="text-red-400 hover:text-red-300 font-bold px-1">&times;</button>`;
                    } else {
                        pDiv.innerHTML = `<span class="text-gray-400 w-4 text-center text-xs">${index + 1}</span><span class="flex-1 font-medium px-1">${p.name}</span>`;
                    }
                    pList.appendChild(pDiv);
                });
            }
            document.getElementById('participant-count').textContent = bracket.participants ? bracket.participants.length : 0;
            document.getElementById('admin-participant-controls').classList.toggle('hidden', !(isAdmin && bracket.status === 'Pending'));
            document.getElementById('bracket-status').textContent = bracket.status;
            document.getElementById('btn-start-tournament').classList.toggle('hidden', !(isAdmin && bracket.status === 'Pending' && bracket.participants && bracket.participants.length >= 2));

            renderBracketVisual(bracket);
        }

        function generateParticipants() {
            const bracket = brackets.find(b => b.id === currentBracketId);
            if (bracket.status !== 'Pending') return;
            const targetCount = parseInt(document.getElementById('input-participant-count').value) || 0;
            if (targetCount < 2 || targetCount > 64) return alert("Jumlah peserta 2-64.");

            if (!bracket.participants) bracket.participants = [];

            if (targetCount < bracket.participants.length) {
                bracket.participants = bracket.participants.slice(0, targetCount);
            } else if (targetCount > bracket.participants.length) {
                for (let i = bracket.participants.length; i < targetCount; i++) {
                    bracket.participants.push({ id: 'p-' + Date.now() + '-' + i, name: `Team ${i + 1}` });
                }
            }
            saveData();
        }

        function editParticipantName(pId, newName) {
            const bracket = brackets.find(b => b.id === currentBracketId);
            if (bracket.status !== 'Pending') return;
            const participant = bracket.participants.find(p => p.id === pId);
            if (participant) { participant.name = newName.trim() || "Team Tanpa Nama"; saveData(); }
        }

        function removeParticipant(pId) {
            const bracket = brackets.find(b => b.id === currentBracketId);
            if (bracket.status === 'Pending') {
                bracket.participants = bracket.participants.filter(p => p.id !== pId);
                document.getElementById('input-participant-count').value = bracket.participants.length;
                saveData();
            }
        }

        function updateBracketName(newName) {
            const bracket = brackets.find(b => b.id === currentBracketId);
            if (bracket && isAdmin && bracket.status === 'Pending') {
                bracket.name = newName.trim() || "Turnamen Tanpa Nama";
                saveData();
                document.getElementById('nav-bracket-name').textContent = bracket.name;
            }
        }

        // === TOURNAMENT LOGIC ===
        function startTournament() {
            const bracket = brackets.find(b => b.id === currentBracketId);
            if (bracket.participants.length < 2) return alert("Minimal 2 peserta!");
            bracket.status = "In Progress";
            generateFixedBracket(bracket);
            saveData();
        }

        function generateFixedBracket(bracket) {
            let participants = [...bracket.participants];
            participants.sort(() => Math.random() - 0.5);

            let totalSlots = Math.pow(2, Math.ceil(Math.log2(participants.length)));
            while (participants.length < totalSlots) {
                participants.push({ id: 'bye-' + Date.now() + Math.random(), name: 'BYE' });
            }

            const totalRounds = Math.log2(totalSlots);
            let allMatches = [];
            let matchIdCounter = 1;

            for (let i = 0; i < participants.length; i += 2) {
                allMatches.push({
                    id: `m-${matchIdCounter++}`, round: 1,
                    team1: participants[i], team2: participants[i+1],
                    score1: null, score2: null, winner: null
                });
            }

            for (let r = 2; r <= totalRounds; r++) {
                const matchesInRound = totalSlots / Math.pow(2, r);
                for (let i = 0; i < matchesInRound; i++) {
                    allMatches.push({
                        id: `m-${matchIdCounter++}`, round: r,
                        team1: null, team2: null, score1: null, score2: null, winner: null
                    });
                }
            }

            bracket.matches = allMatches;
            bracket.totalRounds = totalRounds;
            processByesFixed(bracket);
        }

        // === RENDER BRACKET VISUAL ===
        function renderBracketVisual(bracket) {
            const container = document.getElementById('bracket-container');
            container.innerHTML = '';

            if (bracket.status === 'Pending') {
                container.innerHTML = '<div class="text-gray-500 italic m-auto mt-10">Bracket belum dimulai.</div>';
                return;
            }

            const totalRounds = bracket.totalRounds || Math.ceil(Math.log2(bracket.participants.length));

            for (let r = 1; r <= totalRounds; r++) {
                const roundDiv = document.createElement('div');
                roundDiv.className = "bracket-column";
                if (r === totalRounds) roundDiv.classList.add('single-match');

                const header = document.createElement('div');
                header.className = "absolute -top-8 left-0 right-0 text-center text-xs text-gray-500 font-bold tracking-wider";
                header.textContent = r === totalRounds ? "FINAL" : `ROUND ${r}`;
                roundDiv.appendChild(header);

                let matchesInRound = bracket.matches.filter(m => m.round === r);

                for (let i = 0; i < matchesInRound.length; i += 2) {
                    const pairDiv = document.createElement('div');
                    pairDiv.className = "match-pair";
                    if (matchesInRound[i]) pairDiv.appendChild(createMatchBox(matchesInRound[i]));
                    if (matchesInRound[i+1]) pairDiv.appendChild(createMatchBox(matchesInRound[i+1]));
                    roundDiv.appendChild(pairDiv);
                }
                container.appendChild(roundDiv);
            }
        }

        function createMatchBox(match) {
            const matchDiv = document.createElement('div');
            matchDiv.className = "match-box";

            const t1Class = match.winner === match.team1?.id ? "winner-slot" : "text-gray-300";
            const t2Class = match.winner === match.team2?.id ? "winner-slot" : "text-gray-300";

            const team1Name = match.team1 ? match.team1.name : 'TBD';
            const team2Name = match.team2 ? match.team2.name : 'TBD';
            const score1 = match.score1 !== null ? match.score1 : '-';
            const score2 = match.score2 !== null ? match.score2 : '-';

            const canClick = isAdmin && !match.winner && match.team1 && match.team2 && match.team1.name !== 'BYE' && match.team2.name !== 'BYE';

            matchDiv.innerHTML = `
                <div class="team-slot ${t1Class}">
                    <span class="truncate w-36">${team1Name}</span>
                    <span class="bg-gray-900 px-2 py-0.5 rounded text-xs font-mono">${score1}</span>
                </div>
                <div class="team-slot ${t2Class}">
                    <span class="truncate w-36">${team2Name}</span>
                    <span class="bg-gray-900 px-2 py-0.5 rounded text-xs font-mono">${score2}</span>
                </div>
                ${canClick ? `<div class="absolute inset-0 bg-blue-500 bg-opacity-0 hover:bg-opacity-20 cursor-pointer flex items-center justify-center transition" onclick="openScoreModal('${match.id}')"><span class="opacity-0 hover:opacity-100 text-xs bg-black/50 px-2 py-1 rounded">Input Skor</span></div>` : ''}
            `;
            return matchDiv;
        }

        function processByesFixed(bracket) {
            let changed = false;
            bracket.matches.filter(m => m.round === 1).forEach(match => {
                if (match.team1?.name === 'BYE' && !match.winner && match.team2) {
                    match.winner = match.team2.id; match.score1 = 0; match.score2 = 1; changed = true;
                } else if (match.team2?.name === 'BYE' && !match.winner && match.team1) {
                    match.winner = match.team1.id; match.score1 = 1; match.score2 = 0; changed = true;
                }
            });
            if (changed) {
                bracket.matches.forEach(m => { if (m.winner) advanceWinnerFixed(m); });
            }
        }

        // === SCORE MODAL LOGIC ===
        function openScoreModal(matchId) {
            if (!isAdmin) return;
            const bracket = brackets.find(b => b.id === currentBracketId);
            const match = bracket.matches.find(m => m.id === matchId);
            if (!match || match.winner) return alert("Pertandingan ini sudah selesai!");
            currentMatch = match;

            document.getElementById('modal-team1-name').textContent = match.team1.name;
            document.getElementById('modal-team2-name').textContent = match.team2.name;
            document.getElementById('modal-team1-score').value = match.score1 || 0;
            document.getElementById('modal-team2-score').value = match.score2 || 0;
            document.getElementById('score-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('score-modal').classList.add('hidden'); currentMatch = null; }
        function changeScore(inputId, amount) {
            const input = document.getElementById(inputId);
            input.value = Math.max(0, (parseInt(input.value) || 0) + amount);
        }

        function submitScore() {
            if (!currentMatch) return;
            const s1 = parseInt(document.getElementById('modal-team1-score').value) || 0;
            const s2 = parseInt(document.getElementById('modal-team2-score').value) || 0;
            if (s1 === s2) return alert("Skor tidak boleh seri!");

            currentMatch.score1 = s1; currentMatch.score2 = s2;
            currentMatch.winner = s1 > s2 ? currentMatch.team1.id : currentMatch.team2.id;

            advanceWinnerFixed(currentMatch);
            saveData();
            closeModal();
        }

        function advanceWinnerFixed(match) {
            const bracket = brackets.find(b => b.id === currentBracketId);
            const nextRound = match.round + 1;

            let nextMatch = bracket.matches.find(m => m.round === nextRound && (m.team1 === null || m.team2 === null));
            if (!nextMatch) return false;

            const winnerTeam = match.winner === match.team1.id ? match.team1 : match.team2;
            if (nextMatch.team1?.id === winnerTeam.id || nextMatch.team2?.id === winnerTeam.id) return false;

            if (!nextMatch.team1) nextMatch.team1 = winnerTeam;
            else if (!nextMatch.team2) nextMatch.team2 = winnerTeam;
            return true;
        }

        // === UTILS ===
        function showLandingPage() { currentBracketId = null; renderLandingPage(); }

        // === INIT ===
        document.addEventListener('DOMContentLoaded', () => {
            updateAdminUI();
        });
    </script>
</body>
</html>
